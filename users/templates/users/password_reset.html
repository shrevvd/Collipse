{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-center mt-5">
    <div style="width: 400px;">
        <div class="card-custom-left p-4">
            <h3 class="text-center mb-4" style="color: #D9D9D9; font-weight: 700;">Reset Password</h3>
            <form method="POST">
                {% csrf_token %}
                <input type="email" name="email" class="search-box mb-3" placeholder="Email" required style="width: 100%; padding: 10px 15px; border-radius: 9px;">
                <button type="submit" style="width: 100%; background: #251C2D; color: #D9D9D9; border: 1px solid #D9D9D9; border-radius: 9px; padding: 10px; font-size: 16px; cursor: pointer;">Send</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
