{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collipse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B191D;
            min-height: 100vh;
        }


        .navbar {
            background: #111012;
            height: 100px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            border-bottom: 2px solid #D9D9D9;
            z-index: 10 !important;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 2.5rem;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .now-playing {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 9px;
            color: white;
            padding: 6px 20px;
            flex: 1;
            width: 300px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-playing.placeholder-text {
            color: rgba(255, 255, 255, 0.4);
        }

        .nav-icons {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-left: auto;
            margin-right: 140px;
            padding-left: 30px;
            position: relative;
        }

        .glow-indicator {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 70px;
            height: 70px;
            background: url("{% static 'icons/ПОДСВЕТКА.svg' %}") center/contain no-repeat;
            z-index: 0;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon {
            cursor: pointer;
            z-index: 1;
            position: relative;
        }
        .nav-icon img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(0.85);
            transition: filter 0.3s;
        }
        .nav-icon.active img { filter: brightness(0) invert(1); }

        .nav-icon:nth-child(2) img { width: 42px; height: 42px; }
        .nav-icon:nth-child(3) img { width: 40px; height: 40px; }
        .nav-icon:nth-child(4) img { width: 42px; height: 42px; }

        .nav-icon:nth-child(2) { margin-top: 3px; }
        .nav-icon:nth-child(3) { margin-top: 0px; }
        .nav-icon:nth-child(4) { margin-top: 2px; }

        .avatar-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: #111012;
            border: none;
            position: fixed;
            right: -30px;
            top: -30px;
            z-index: 20;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }

        .avatar-back {
            width: 163px;
            height: 163px;
            right: -31px;
            top: -31px;
            z-index: 5;
            border: 4px solid #D9D9D9;
            background: transparent;
            position: fixed;
        }

        .search-box {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 6px 15px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-box img {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(0.7);
            margin-left: 10px;
        }

        .card-custom-left { background: #353237; border-radius: 16px; border: none; }
        .card-custom-rec { background: radial-gradient(circle at center, #47414C, #353237); border-radius: 16px; border: none; }
        .card-custom-right { background: radial-gradient(circle at center, #201C23, #353237); border-radius: 16px; border: none; }

        .play-icon { width: 60px; height: 60px; cursor: pointer; filter: brightness(0) invert(1); }
        .play-icon:hover { opacity: 0.8; }
        .upload-link { text-decoration: underline; text-underline-offset: 4px; color: #aaa; cursor: pointer; }

        .tab-btn {
            background: #6a6372;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            flex: 1;
            border-radius: 155px;
            cursor: pointer;
        }
        .tab-btn.active { background: #443f4b; color: white; }

        /* ДИСК */
        .disc-wrapper {
            position: fixed;
            bottom: 50px;
            left: calc(16.66% - 200px);
            z-index: 100;
        }

        .disc-container {
            position: relative;
            width: 200px;
            height: 130px;
        }

        .disc-cover-spin {
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 460px;
            height: 460px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 1;
        }
        .disc-cover-spin img { width: 100%; height: 100%; }

        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }
        .disc-cover-spin.playing { animation: spin 4s linear infinite; }

        .disc-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .disc-back {
            pointer-events: auto;
            cursor: grab;
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            width: 520px;
        }
        .disc-back:active { cursor: grabbing; }

        .disc-front {
            z-index: 3;
            width: 160px;
            bottom: 75px;
            pointer-events: auto;
        }

        /* --- Кнопки на диске --- */
        .disc-btn {
            position: absolute;
            z-index: 15;
            cursor: pointer;
            pointer-events: auto;
        }

        .disc-btn-next {
            top: -195px;
            left: 100%;
            transform: translateX(-50%);
            width: 100px;
        }

        .disc-btn-prev {
            bottom: -15px;
            left: 100%;
            transform: translateX(-50%);
            width: 100px;
        }

        .disc-btn-pause {
            top: -23px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            z-index: 20;
        }

        .disc-heart-empty {
            bottom: 132px;
            right: -100px;
            width: 45px;
        }

        .disc-heart-broken {
            bottom: 132px;
            right: -45px;
            width: 45px;
        }

        .track-row { padding: 4px 12px; margin: 0 -12px; }
        .track-row:hover { background: rgba(255, 255, 255, 0.03); border-radius: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">Collipse</a>
        <div class="now-playing placeholder-text" id="nowPlaying">Choose a song!</div>
        <div class="nav-icons" id="navIcons">
            <div class="glow-indicator"></div>
            <span class="nav-icon active" data-tab="music"><img src="{% static 'icons/МУЗЫКА.svg' %}" alt="Музыка"></span>
            <span class="nav-icon" data-tab="chat"><img src="{% static 'icons/ЧАТЫ.svg' %}" alt="Чаты"></span>
            <span class="nav-icon" data-tab="settings"><img src="{% static 'icons/НАСТРОЙКИ.svg' %}" alt="Настройки"></span>
        </div>
    </nav>

    <div class="avatar-circle avatar-back"></div>
    <div class="avatar-circle avatar-front">
        <img src="{% static 'icons/АВАТАР.svg' %}" alt="avatar">
    </div>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <div class="disc-wrapper">
        <div class="disc-container">
            <!-- Задняя часть (таскается) -->
            <img src="{% static 'player/ЗАДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-back" alt="">
            
            <!-- Обложка (крутится) -->
            <div class="disc-cover-spin playing">
                <img src="{% static 'player/ЧЕРНЫЙ_ДИСК.jpg' %}" alt="cover">
            </div>
            
            <!-- Кнопка СЛЕДУЮЩАЯ (вверху) -->
            <img src="{% static 'player/СЛЕДУЮЩАЯ_ПЕСНЯ.svg' %}" class="disc-btn disc-btn-next" alt="Next">
            
            <!-- Кнопка ПРЕДЫДУЩАЯ (внизу) -->
            <img src="{% static 'player/ПРЕДЫДУЩАЯ_ПЕСНЯ.svg' %}" class="disc-btn disc-btn-prev" alt="Prev">
            
            <!-- Сердечки между ними -->
            <img src="{% static 'player/ПУСТОЕ_СЕРДЦЕ.svg' %}" class="disc-btn disc-heart-empty" alt="Like">
            <img src="{% static 'player/РАЗБИТОЕ_СЕРДЦЕ.svg' %}" class="disc-btn disc-heart-broken" alt="Dislike">
            
            <!-- Передняя часть (пауза) -->
            <img src="{% static 'player/ПЕРЕДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-front" alt="">
            <img src="{% static 'player/ПАУЗА.svg' %}" class="disc-btn disc-btn-pause" alt="Pause">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переплывающая подсветка
        const indicator = document.querySelector('.glow-indicator');
        const icons = document.querySelectorAll('.nav-icon');
        
        // Установить подсветку на активную иконку при загрузке
        const activeIcon = document.querySelector('.nav-icon.active');
        if (activeIcon) {
            indicator.style.left = (activeIcon.offsetLeft + activeIcon.offsetWidth/2 - 27) + 'px';
        }
        
        icons.forEach(icon => {
            icon.addEventListener('click', function() {
                // Убрать active у всех
                icons.forEach(i => i.classList.remove('active'));
                // Добавить на текущую
                this.classList.add('active');
                // Передвинуть подсветку
                indicator.style.left = (this.offsetLeft + this.offsetWidth/2 - 27) + 'px';
            });
        });
    </script>

    <script>
        const disc = document.querySelector('.disc-back');   // ← поменяли
        const wrapper = document.querySelector('.disc-wrapper');
        let isDragging = false;
        let startX, startY, startLeft, startBottom;

        disc.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
            startLeft = parseInt(window.getComputedStyle(wrapper).left) || 0;
            startBottom = parseInt(window.getComputedStyle(wrapper).bottom) || 0;
            e.preventDefault();
        });

        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = startY - e.clientY;
            wrapper.style.left = (startLeft + dx) + 'px';
            wrapper.style.bottom = (startBottom + dy) + 'px';
        });

        document.addEventListener('mouseup', function() {
            isDragging = false;
        });
    </script>

</body>
</html>
