{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <link rel="icon" type="image/svg+xml" href="{% static 'icons/НАУШНИКИ.svg' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collipse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B191D;
            min-height: 100vh;
            margin: 0;
        }

        .navbar {
            background: #111012;
            height: 100px;
            width: 100vw;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: fixed;
            border-bottom: 2px solid #D9D9D9;
            z-index: 10 !important;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 2.5rem;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .now-playing {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 9px;
            color: white;
            padding: 6px 20px;
            flex: 1;
            width: 300px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: width 0.5s, opacity 0.3s;
            opacity: 0.6;
        }
        .now-playing.placeholder-text {
            color: rgba(255, 255, 255, 0.4);
        }

        .now-playing.placeholder-text-active {
            color: rgba(255, 255, 255, 0.979)
        }

        .nav-icons {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-left: auto;
            margin-right: 140px;
            padding-left: 30px;
            position: relative;
            transition: margin-right 0.5s;
        }

        .glow-indicator {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 70px;
            height: 70px;
            background: url("{% static 'icons/ПОДСВЕТКА.svg' %}") center/contain no-repeat;
            z-index: 0;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon {
            cursor: pointer;
            z-index: 1;
            position: relative;
        }
        .nav-icon img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(0.85);
            transition: filter 0.3s;
        }
        .nav-icon.active img { filter: brightness(0) invert(1); }

        .nav-icon:nth-child(2) img { width: 42px; height: 42px; }
        .nav-icon:nth-child(3) img { width: 40px; height: 40px; }
        .nav-icon:nth-child(4) img { width: 42px; height: 42px; }

        .nav-icon:nth-child(2) { margin-top: 3px; }
        .nav-icon:nth-child(3) { margin-top: 0px; }
        .nav-icon:nth-child(4) { margin-top: 2px; }

        .avatar-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: #111012;
            border: none;
            position: fixed;
            right: -30px;
            top: -30px;
            z-index: 20;
            transition: width 0.5s, height 0.5s, right 0.5s, top 0.5s;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .avatar-back {
            width: 163px;
            height: 163px;
            right: -31px;
            top: -31px;
            z-index: 5;
            border: 4px solid #D9D9D9;
            background: transparent;
            position: fixed;
            transition: width 0.5s, height 0.5s, right 0.5s, top 0.5s;
        }

        /* Режим профиля */
        .avatar-circle.profile-expanded {
            width: 250px;
            height: 250px;
            right: 10px;
            top: -20px;
        }
        .avatar-back.profile-expanded {
            width: 258px;
            height: 258px;
            right: 6px;
            top: -24px;
        }
        .navbar.profile-mode .now-playing {
            width: 150px;
        }
        .navbar.profile-mode .nav-icons {
            margin-right: 240px;
        }

        .search-box {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 6px 15px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-box img {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(0.7);
            margin-left: 10px;
        }

        .card-custom-left { background: #353237; border-radius: 16px; border: none; }
        .card-custom-rec { background: radial-gradient(circle at center, #47414C, #353237); border-radius: 16px; border: none; }
        .card-custom-right { background: radial-gradient(circle at center, #201C23, #353237); border-radius: 16px; border: none; }

        .play-icon { width: 60px; height: 60px; cursor: pointer; filter: brightness(0) invert(1); }
        .play-icon:hover { opacity: 0.8; }
        .upload-link { text-decoration: underline; text-underline-offset: 4px; color: #aaa; cursor: pointer; }

        .tab-btn {
            background: #6a6372;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            flex: 1;
            border-radius: 155px;
            cursor: pointer;
        }
        .tab-btn.active { background: #443f4b; color: white; }

        .disc-wrapper {
            position: fixed;
            bottom: 50px;
            left: calc(16.66% - 200px);
            z-index: 100;
            transform: translate(-70px, -40px);
        }
        .disc-container { position: relative; width: 200px; height: 130px; }
        .disc-cover-spin {
            position: absolute;
            bottom: -75px;
            left: 50%;
            transform: translateX(-50%);
            width: 460px;
            height: 460px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 1;
        }
        .disc-cover-spin img { width: 100%; height: 100%; }
        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }
        .disc-cover-spin.playing { animation: spin 10s linear infinite; }
        .disc-layer { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        .disc-back {
            pointer-events: auto;
            cursor: grab;
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            width: 520px;
        }
        .disc-back:active { cursor: grabbing; }
        .disc-front { z-index: 3; width: 160px; bottom: 75px; pointer-events: auto; }
        .disc-rect {
            position: absolute;
            left: 80px;
            top: -30px;
            transform: translateY(-50%);
            z-index: -5;
            width: 345px;
        }

        /* кнопки*/
        .disc-btn {
            position: absolute;
            z-index: 15;
            cursor: pointer;
            pointer-events: auto;
            left: -50px;
        }

        .disc-btn-next {
            top: -260px;
            left: 333px;
            width: 53px;
        }

        .disc-btn-prev {
            top: 145px;
            left: 333px;
            width: 53px;
        }

        .disc-btn-like {
            top: -165px;
            left: 350px;
            width: 55px;
        }

        .disc-btn-info {
            top: -50px;
            left: 370px;
            width: 40px;
        }

        .disc-btn-dislike {
            top: 60px;
            left: 350px;
            width: 55px;
        }

        .disc-btn-pause {
            width: 80px;
            top: -66px;
            left: 60px;

        }

        .track-row { padding: 4px 12px; margin: 0 -12px; }
        .track-row:hover { background: rgba(255, 255, 255, 0.03); border-radius: 14px; }

        .track-row:hover .track-duration {
            margin-right: 40px !important;
        }
        .track-row:hover .track-info-icon {
            display: block !important;
        }
        .track-info-icon:hover img {
            filter: brightness(0) invert(1) !important;
        }

        .track-duration {
            transition: margin-right 0.2s;
            margin-right: 10px;
        }

        .track-info-icon {
            display: none !important;
            position: absolute;
            right: 10px;
            z-index: 5;
        }

        .sticky-left { position: fixed; top: 120px; width: 30%; }
        @media (max-width: 767px) {
            .sticky-left { position: static; width: 100%; }
        }
    </style>
</head>

<body>
    <!-- Модальное окно настроек -->
    <div id="settingsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: #2A282C; border-radius: 16px; padding: 30px; width: 350px; text-align: center;">
            <h3 style="color: #D9D9D9; font-weight: 700; margin-bottom: 20px;">Settings</h3>
            
            {% if request.user.is_authenticated %}
                <a href="{% url 'logout' %}" style="display: block; color: #D9D9D9; text-decoration: none; padding: 10px; border: 1px solid #D9D9D9; border-radius: 9px; margin-bottom: 10px;">Log Out</a>
            {% else %}
                <a href="{% url 'login' %}" style="display: block; color: #D9D9D9; text-decoration: none; padding: 10px; border: 1px solid #D9D9D9; border-radius: 9px; margin-bottom: 10px;">Log In</a>
                <a href="{% url 'register' %}" style="display: block; color: #D9D9D9; text-decoration: none; padding: 10px; border: 1px solid #D9D9D9; border-radius: 9px;">Sign Up</a>
            {% endif %}
            
            <button onclick="document.getElementById('settingsModal').style.display='none'" style="margin-top: 15px; background: none; border: none; color: #79787A; cursor: pointer; font-size: 14px;">Close</button>
        </div>
    </div>
    
    <audio id="audioPlayer" style="display: none;"></audio>
    
    <nav class="navbar" id="mainNavbar">
        <a class="navbar-brand" href="/">Collipse</a>
        <div class="now-playing placeholder-text" id="nowPlaying">Choose a track!</div>
        <div class="nav-icons" id="navIcons">
            <div class="glow-indicator"></div>
            <a href="{% url 'track_list' %}">
                <span class="nav-icon active" data-tab="music">
                    <img src="{% static 'icons/МУЗЫКА.svg' %}" alt="Музыка">
                </span>
            </a>
            <a href="{% url 'chat_list' %}">
                <span class="nav-icon" data-tab="chat">
                    <img src="{% static 'icons/ЧАТЫ.svg' %}" alt="Чаты">
                </span>
            </a>
            <span class="nav-icon" data-tab="settings"><img src="{% static 'icons/НАСТРОЙКИ.svg' %}" alt="Настройки"></span>
        </div>
    </nav>

    <a href="{% if request.user.is_authenticated %}{% url 'profile' request.user.username %}{% else %}{% url 'login' %}{% endif %}" id="avatarLink">
        <div class="avatar-circle avatar-back" id="avatarBack"></div>
        <div class="avatar-circle avatar-front" id="avatarFront">
            {% if request.user.is_authenticated and request.user.profile.avatar %}
                <img src="{{ request.user.profile.avatar.url }}" alt="avatar">
            {% else %}
                <img src="{% static 'icons/АВАТАР.svg' %}" alt="avatar">
            {% endif %}
        </div>
    </a>

    <div class="main-content" style="padding-top: 100px;">
        <div class="container-fluid mt-4">
            {% block content %}{% endblock %}
        </div>
    </div>

   <div class="disc-wrapper">
    <div class="disc-container">
        <img src="{% static 'player/ЗАДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-back" style="border-radius: 50%;" alt="">
        <div class="disc-cover-spin playing">
            <img src="{% static 'player/диск.png' %}" alt="cover">
        </div>
        <img src="{% static 'player/ПЕРЕДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-front" alt="">
        <img src="{% static 'player/задняя_часть_диска_2.svg' %}" class="disc-rect" alt="">
        
        <img src="{% static 'player/NEXT_SONG_WHITE_VER.svg' %}" class="disc-btn disc-btn-next" alt="Next">
        <img src="{% static 'player/PREV_SONG_WHITE_VER.svg' %}" class="disc-btn disc-btn-prev" alt="Prev">
        <img src="{% static 'player/ПАУЗА.svg' %}" class="disc-btn disc-btn-pause" alt="Pause">
        
        <!-- Лайк -->
        <a href="#" id="discLikeLink">
            <img src="{% static 'player/HEART_EMPTY.svg' %}" class="disc-btn disc-btn-like" id="discLikeImg" alt="Like">
        </a>
        
        <!-- Инфо -->
        <a href="#" id="discInfoLink">
            <img src="{% static 'player/ИНФО_ДЛЯ_ТРЕКА.svg' %}" class="disc-btn disc-btn-info" alt="Info">
        </a>
        
        <!-- Дизлайк -->
        <a href="#" id="discDislikeLink">
            <img src="{% static 'player/HEART_BROKEN.svg' %}" class="disc-btn disc-btn-dislike" id="discDislikeImg" alt="Dislike">
        </a>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>

document.querySelector('.nav-icon[data-tab="settings"]').addEventListener('click', function() {
    document.getElementById('settingsModal').style.display = 'flex';
});

document.getElementById('settingsModal').addEventListener('click', function(e) {
    if (e.target === this) this.style.display = 'none';
});
// ============================================================
// ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ (доступны всем скриптам)
// ============================================================
var indicator = document.querySelector('.glow-indicator');
var navIcons = document.querySelectorAll('.nav-icon');
var disc = document.querySelector('.disc-back');
var wrapper = document.querySelector('.disc-wrapper');

// ============================================================
// 1. ПОДСВЕТКА ИКОНОК В НАВБАРЕ
// ============================================================
(function() {
    var activeIcon = document.querySelector('.nav-icon.active');
    if (activeIcon && indicator) {
        indicator.style.left = (activeIcon.offsetLeft + activeIcon.offsetWidth/2 - 27) + 'px';
    }
    navIcons.forEach(function(icon) {
        icon.addEventListener('click', function() {
            navIcons.forEach(function(i) { i.classList.remove('active'); });
            this.classList.add('active');
            if (indicator) {
                indicator.style.left = (this.offsetLeft + this.offsetWidth/2 - 27) + 'px';
            }
        });
    });
})();

// ============================================================
// 2. DRAG ДИСКА
// ============================================================
(function() {
    if (!disc || !wrapper) return;
    
    var savedLeft = localStorage.getItem('discLeft');
    var savedBottom = localStorage.getItem('discBottom');
    if (savedLeft && savedBottom) {
        wrapper.style.left = savedLeft;
        wrapper.style.bottom = savedBottom;
    }
    
    var isDragging = false, startX, startY, startLeft, startBottom;
    
    disc.addEventListener('mousedown', function(e) {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        var style = window.getComputedStyle(wrapper);
        startLeft = parseInt(style.left) || 0;
        startBottom = parseInt(style.bottom) || 0;
        e.preventDefault();
    });
    
    document.addEventListener('mousemove', function(e) {
        if (!isDragging) return;
        wrapper.style.left = (startLeft + e.clientX - startX) + 'px';
        wrapper.style.bottom = (startBottom + startY - e.clientY) + 'px';
        localStorage.setItem('discLeft', wrapper.style.left);
        localStorage.setItem('discBottom', wrapper.style.bottom);
    });
    
    document.addEventListener('mouseup', function() { isDragging = false; });
})();

// ============================================================
// 3. ПЛЕЕР, ЛАЙКИ, ДИЗЛАЙКИ
// ============================================================
var audio = document.getElementById('audioPlayer');
var nowPlaying = document.getElementById('nowPlaying');
var discInfoLink = document.getElementById('discInfoLink');
var discLikeLink = document.getElementById('discLikeLink');
var discLikeImg = document.getElementById('discLikeImg');
var discDislikeLink = document.getElementById('discDislikeLink');
var discDislikeImg = document.getElementById('discDislikeImg');
var currentMode = 'all'; // 'all' или 'likes'
var currentTrackId = null;
var currentTrackRow = null;

function getCSRFToken() {
    var cookie = document.cookie.split('; ').find(function(row) { return row.startsWith('csrftoken='); });
    return cookie ? cookie.split('=')[1] : '';
}

// Восстановление трека
(function() {
    var savedTrack = localStorage.getItem('currentTrack');
    var savedTime = localStorage.getItem('currentTime');
    if (savedTrack && audio) {
        audio.src = savedTrack;
        audio.currentTime = savedTime ? parseFloat(savedTime) : 0;
        audio.play().catch(function() {});
    }
})();

window.addEventListener('beforeunload', function() {
    if (audio && !audio.paused && audio.src) {
        localStorage.setItem('currentTrack', audio.src);
        localStorage.setItem('currentTime', audio.currentTime);
    }
});

// Music RECS
// Универсальная функция обновления диска

function updateDiscInfo(data) {
    if (data.cover_url) {
        var coverImg = document.querySelector('.disc-cover-spin img');
        if (coverImg) coverImg.src = data.cover_url;
    }
    if (discLikeImg) {
        discLikeImg.src = data.is_liked ? discLikeImg.src.replace('HEART_EMPTY', 'HEART_FULL') : discLikeImg.src.replace('HEART_FULL', 'HEART_EMPTY');
    }
    if (discDislikeImg) {
        discDislikeImg.src = data.is_disliked ? discDislikeImg.src.replace('HEART_BROKEN.svg', 'DISLIKE_PRESSED.svg') : discDislikeImg.src.replace('DISLIKE_PRESSED.svg', 'HEART_BROKEN.svg');
    }
    if (discInfoLink) discInfoLink.href = '/track/' + data.id + '/';
    if (discLikeLink) discLikeLink.href = '/track/' + data.id + '/like/';
    if (discDislikeLink) discDislikeLink.href = '/track/' + data.id + '/dislike/';
}

// Воспроизведение трека из данных API

function playRandomTrack() {
    currentMode = 'all';
    playNextTrack();
}

function playTrackFromData(data) {
    if (!data.audio_url) return;
    audio.src = data.audio_url;
    audio.play();
    currentTrackId = data.id;
    if (nowPlaying) {
        nowPlaying.textContent = data.title;
        nowPlaying.classList.remove('placeholder-text');
        nowPlaying.classList.add('placeholder-text-active');
    }
    updateDiscInfo(data);
}

// Music RECS (или следующий трек)
function playNextTrack() {
    var url = currentMode === 'likes' ? '/liked-tracks-api/' : '/random-api/';
    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(data) {
            playTrackFromData(data);
        });
}

// Обработчик окончания трека — всегда вызывает playNextTrack
if (audio) {
    audio.addEventListener('ended', function() {
        currentTrackRow = null;
        playNextTrack();
    });
}

// Лайк
if (discLikeLink) {
    discLikeLink.addEventListener('click', function(e) {
        e.preventDefault();
        if (!currentTrackId) return;
        fetch('/track/' + currentTrackId + '/like/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCSRFToken() }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'liked') {
                discLikeImg.src = discLikeImg.src.replace('HEART_EMPTY', 'HEART_FULL');
            } else if (data.status === 'unliked') {
                discLikeImg.src = discLikeImg.src.replace('HEART_FULL', 'HEART_EMPTY');
            }
        });
    });
}

// Дизлайк
if (discDislikeLink) {
    discDislikeLink.addEventListener('click', function(e) {
        e.preventDefault();
        if (!currentTrackId) return;
        fetch('/track/' + currentTrackId + '/dislike/', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCSRFToken() }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.status === 'disliked') {
                discDislikeImg.src = discDislikeImg.src.replace('HEART_BROKEN.svg', 'DISLIKE_PRESSED.svg');
                playRandomTrack();
            } else if (data.status === 'undisliked') {
                discDislikeImg.src = discDislikeImg.src.replace('DISLIKE_PRESSED.svg', 'HEART_BROKEN.svg');
            }
        });
    });
}

// Клик по трекам
document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('.track-row').forEach(function(row) {
        row.addEventListener('click', function() {
            var audioUrl = this.dataset.audio;
            if (!audioUrl) return;
            if (currentTrackRow === this) {
                audio.paused ? audio.play() : audio.pause();
            } else {
                currentTrackRow = this;
                audio.src = audioUrl;
                audio.play();
                var titleDiv = this.querySelector('div[style*="flex: 1"] div[style*="color: white"]');
                if (titleDiv && nowPlaying) {
                    nowPlaying.textContent = titleDiv.textContent.trim();
                    nowPlaying.classList.remove('placeholder-text');
                    nowPlaying.classList.add('placeholder-text-active');
                }
                var infoLink = this.querySelector('.track-info-icon');
                if (infoLink && discInfoLink) discInfoLink.href = infoLink.href;
                var trackUrl = this.querySelector('.track-info-icon');
                if (trackUrl) {
                    var id = trackUrl.href.split('/track/')[1]?.split('/')[0];
                    if (id) currentTrackId = id;
                }
                localStorage.setItem('currentTrack', audioUrl);
            }
        });
    });
    if (audio) {
        audio.addEventListener('ended', function() {
            currentTrackRow = null;
            if (nowPlaying) {
                nowPlaying.textContent = 'Choose a track!';
                nowPlaying.classList.remove('placeholder-text-active');
                nowPlaying.classList.add('placeholder-text');
            }
        });
    }
});
</script>

</body>
</html>
