{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collipse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1B191D; min-height: 100vh; }
        
        .navbar {
            background: #111012;
            height: 100px;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: relative;
            border-bottom: 2px solid #D9D9D9;
            z-index: 10 !important;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 2.5rem;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .now-playing {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 9px;
            color: white;
            padding: 6px 20px;
            flex: 1;
            width: 300px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-playing.placeholder-text {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .nav-icons {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-left: auto;
            margin-right: 140px;
            padding-left: 30px;
            position: relative;
        }

        /* Подсветка — переплывает */
        .glow-indicator {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 70px;
            height: 70px;
            background: url("{% static 'icons/ПОДСВЕТКА.svg' %}") center/contain no-repeat;
            z-index: 0;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon {
            cursor: pointer;
            z-index: 1;
            position: relative;
        }
        .nav-icon img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(0.85);
            transition: filter 0.3s;
        }
        .nav-icon.active img {
            filter: brightness(0) invert(1);
        }

        .nav-icon:nth-child(2) img { width: 42px; height: 42px; }
        .nav-icon:nth-child(3) img { width: 40px; height: 40px; }
        .nav-icon:nth-child(4) img { width: 42px; height: 42px; }

        .nav-icon:nth-child(2) { margin-top: 3px; }
        .nav-icon:nth-child(3) { margin-top: 0px; }
        .nav-icon:nth-child(4) { margin-top: 2px; }
        
        .avatar-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: #111012;
            border: none;
            position: fixed;
            right: -30px;
            top: -30px;
            z-index: 20;
        }
        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .avatar-back {
            width: 163px;
            height: 163px;
            right: -31px;
            top: -31px;
            z-index: 5;
            border: 4px solid #D9D9D9;
            background: transparent;
            position: fixed;
        }

        .search-bar {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 20px;
            color: white;
            padding-left: 15px;
        }
        
        .card-custom-left { background: #353237; border-radius: 16px; border: none; }
        .card-custom-rec { background: radial-gradient(circle at center, #47414C, #353237); border-radius: 16px; border: none; }
        .card-custom-right { background: radial-gradient(circle at center, #201C23, #353237); border-radius: 16px; border: none; }
        
        .play-icon { width: 60px; height: 60px; cursor: pointer; filter: brightness(0) invert(1); }
        .play-icon:hover { opacity: 0.8; }
        .upload-link { text-decoration: underline; text-underline-offset: 4px; color: #aaa; cursor: pointer; }
        
        .tab-btn {
            background: #454347;    /* цвет кнопок */
            border: none;
            color: #aaa;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #444444;    /* активная чуть темнее (или светлее — как хочешь) */
            color: white;
        }
        
        .disc-wrapper {
            position: fixed;
            bottom: 50px;
            left: 0px;
            transform: none;
            z-index: 100;
        }
        
        .disc-container {
            position: relative;
            width: 200px;
            height: 130px;
        }
        
        .disc-cover-spin {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 440px;
            height: 440px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 1;
            /* mask удалён */
        }

        .disc-cover-spin img {
            width: 100%;
            height: 100%;
            /* object-fit: cover; */
        }

        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }

        .disc-cover-spin.playing {
            animation: spin 4s linear infinite;
        }

        .disc-layer {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .disc-back {
            position: absolute;
            bottom: -100px;  /* подгони */
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            width: 520px;
        }

        .disc-front {
            z-index: 3;
            width: 160px;
            bottom: 75px;
        }
        
        .track-row { padding: 4px 12px; margin: 0 -12px; }
        .track-row:hover { background: rgba(255, 255, 255, 0.03); border-radius: 14px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a class="navbar-brand" href="/">Collipse</a>
        <div class="now-playing placeholder-text" id="nowPlaying">Choose a song!</div>
        <div class="nav-icons" id="navIcons">
            <div class="glow-indicator"></div>
            <span class="nav-icon active" data-tab="music"><img src="{% static 'icons/МУЗЫКА.svg' %}" alt="Музыка"></span>
            <span class="nav-icon" data-tab="chat"><img src="{% static 'icons/ЧАТЫ.svg' %}" alt="Чаты"></span>
            <span class="nav-icon" data-tab="settings"><img src="{% static 'icons/НАСТРОЙКИ.svg' %}" alt="Настройки"></span>
        </div>
    </nav>

    <div class="avatar-circle avatar-back"></div>
    <div class="avatar-circle avatar-front">
        <img src="https://via.placeholder.com/120" alt="avatar">
    </div>

    <div class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </div>

    <div class="disc-wrapper">
        <div class="disc-container">
            <img src="{% static 'player/ЗАДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-back" alt="">
            <div class="disc-cover-spin playing">
                <img src="{% static 'player/ЧЕРНЫЙ_ДИСК.jpg' %}" alt="cover">
            </div>
            <img src="{% static 'player/ПЕРЕДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-front" alt="">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Переплывающая подсветка
        const indicator = document.querySelector('.glow-indicator');
        const icons = document.querySelectorAll('.nav-icon');
        
        // Установить подсветку на активную иконку при загрузке
        const activeIcon = document.querySelector('.nav-icon.active');
        if (activeIcon) {
            indicator.style.left = (activeIcon.offsetLeft + activeIcon.offsetWidth/2 - 27) + 'px';
        }
        
        icons.forEach(icon => {
            icon.addEventListener('click', function() {
                // Убрать active у всех
                icons.forEach(i => i.classList.remove('active'));
                // Добавить на текущую
                this.classList.add('active');
                // Передвинуть подсветку
                indicator.style.left = (this.offsetLeft + this.offsetWidth/2 - 27) + 'px';
            });
        });
    </script>
</body>
</html>
