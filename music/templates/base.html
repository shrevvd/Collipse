{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collipse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B191D;
            min-height: 100vh;
            margin: 0;
        }

        .navbar {
            background: #111012;
            height: 100px;
            width: 100vw;
            display: flex;
            align-items: center;
            padding: 0 30px;
            position: fixed;
            border-bottom: 2px solid #D9D9D9;
            z-index: 10 !important;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 2.5rem;
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }
        .now-playing {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 9px;
            color: white;
            padding: 6px 20px;
            flex: 1;
            width: 300px;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: width 0.5s, opacity 0.3s;
            opacity: 0.6;
        }
        .now-playing.placeholder-text {
            color: rgba(255, 255, 255, 0.4);
        }

        .now-playing.placeholder-text-active {
            color: rgba(255, 255, 255, 0.979)
        }

        .nav-icons {
            display: flex;
            gap: 30px;
            align-items: center;
            margin-left: auto;
            margin-right: 140px;
            padding-left: 30px;
            position: relative;
            transition: margin-right 0.5s;
        }

        .glow-indicator {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            width: 70px;
            height: 70px;
            background: url("{% static 'icons/ПОДСВЕТКА.svg' %}") center/contain no-repeat;
            z-index: 0;
            pointer-events: none;
            transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-icon {
            cursor: pointer;
            z-index: 1;
            position: relative;
        }
        .nav-icon img {
            width: 40px;
            height: 40px;
            filter: brightness(0) invert(0.85);
            transition: filter 0.3s;
        }
        .nav-icon.active img { filter: brightness(0) invert(1); }

        .nav-icon:nth-child(2) img { width: 42px; height: 42px; }
        .nav-icon:nth-child(3) img { width: 40px; height: 40px; }
        .nav-icon:nth-child(4) img { width: 42px; height: 42px; }

        .nav-icon:nth-child(2) { margin-top: 3px; }
        .nav-icon:nth-child(3) { margin-top: 0px; }
        .nav-icon:nth-child(4) { margin-top: 2px; }

        .avatar-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            overflow: hidden;
            background: #111012;
            border: none;
            position: fixed;
            right: -30px;
            top: -30px;
            z-index: 20;
            transition: width 0.5s, height 0.5s, right 0.5s, top 0.5s;
        }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; cursor: pointer; }

        .avatar-back {
            width: 163px;
            height: 163px;
            right: -31px;
            top: -31px;
            z-index: 5;
            border: 4px solid #D9D9D9;
            background: transparent;
            position: fixed;
            transition: width 0.5s, height 0.5s, right 0.5s, top 0.5s;
        }

        /* Режим профиля */
        .avatar-circle.profile-expanded {
            width: 250px;
            height: 250px;
            right: 10px;
            top: -20px;
        }
        .avatar-back.profile-expanded {
            width: 258px;
            height: 258px;
            right: 6px;
            top: -24px;
        }
        .navbar.profile-mode .now-playing {
            width: 150px;
        }
        .navbar.profile-mode .nav-icons {
            margin-right: 240px;
        }

        .search-box {
            background: transparent;
            border: 1px solid #D9D9D9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 6px 15px;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            outline: none;
            font-size: 14px;
        }
        .search-box input::placeholder { color: rgba(255, 255, 255, 0.4); }
        .search-box img {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(0.7);
            margin-left: 10px;
        }

        .card-custom-left { background: #353237; border-radius: 16px; border: none; }
        .card-custom-rec { background: radial-gradient(circle at center, #47414C, #353237); border-radius: 16px; border: none; }
        .card-custom-right { background: radial-gradient(circle at center, #201C23, #353237); border-radius: 16px; border: none; }

        .play-icon { width: 60px; height: 60px; cursor: pointer; filter: brightness(0) invert(1); }
        .play-icon:hover { opacity: 0.8; }
        .upload-link { text-decoration: underline; text-underline-offset: 4px; color: #aaa; cursor: pointer; }

        .tab-btn {
            background: #6a6372;
            border: none;
            color: #aaa;
            padding: 8px 16px;
            flex: 1;
            border-radius: 155px;
            cursor: pointer;
        }
        .tab-btn.active { background: #443f4b; color: white; }

        .disc-wrapper {
            position: fixed;
            bottom: 50px;
            left: calc(16.66% - 200px);
            z-index: 100;
            transform: translate(-70px, -40px);
        }
        .disc-container { position: relative; width: 200px; height: 130px; }
        .disc-cover-spin {
            position: absolute;
            bottom: -75px;
            left: 50%;
            transform: translateX(-50%);
            width: 460px;
            height: 460px;
            border-radius: 50%;
            overflow: hidden;
            z-index: 1;
        }
        .disc-cover-spin img { width: 100%; height: 100%; }
        @keyframes spin { 100% { transform: translateX(-50%) rotate(360deg); } }
        .disc-cover-spin.playing { animation: spin 4s linear infinite; }
        .disc-layer { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); }
        .disc-back {
            pointer-events: auto;
            cursor: grab;
            position: absolute;
            bottom: -100px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
            width: 520px;
        }
        .disc-back:active { cursor: grabbing; }
        .disc-front { z-index: 3; width: 160px; bottom: 75px; pointer-events: auto; }
        .disc-rect {
            position: absolute;
            left: 80px;
            top: -30px;
            transform: translateY(-50%);
            z-index: -5;
            width: 345px;
        }

        /* кнопки*/
        .disc-btn {
            position: absolute;
            z-index: 15;
            cursor: pointer;
            pointer-events: auto;
            left: -50px;
        }

        .disc-btn-next {
            top: -260px;
            left: 333px;
            width: 53px;
        }

        .disc-btn-prev {
            top: 145px;
            left: 333px;
            width: 53px;
        }

        .disc-btn-like {
            top: -165px;
            left: 350px;
            width: 55px;
        }

        .disc-btn-info {
            top: -50px;
            left: 370px;
            width: 40px;
        }

        .disc-btn-dislike {
            top: 60px;
            left: 350px;
            width: 55px;
        }

        .track-row { padding: 4px 12px; margin: 0 -12px; }
        .track-row:hover { background: rgba(255, 255, 255, 0.03); border-radius: 14px; }

        .track-row:hover .track-duration {
            margin-right: 40px !important;
        }
        .track-row:hover .track-info-icon {
            display: block !important;
        }
        .track-info-icon:hover img {
            filter: brightness(0) invert(1) !important;
        }

        .track-duration {
            transition: margin-right 0.2s;
            margin-right: 10px;
        }

        .track-info-icon {
            display: none !important;
            position: absolute;
            right: 10px;
            z-index: 5;
        }

        .sticky-left { position: fixed; top: 120px; width: 30%; }
        @media (max-width: 767px) {
            .sticky-left { position: static; width: 100%; }
        }
    </style>
</head>
<body>
    <nav class="navbar" id="mainNavbar">
        <a class="navbar-brand" href="/">Collipse</a>
        <div class="now-playing placeholder-text" id="nowPlaying">Choose a track!</div>
        <div class="nav-icons" id="navIcons">
            <div class="glow-indicator"></div>
            <span class="nav-icon active" data-tab="music"><img src="{% static 'icons/МУЗЫКА.svg' %}" alt="Музыка"></span>
            <span class="nav-icon" data-tab="chat"><img src="{% static 'icons/ЧАТЫ.svg' %}" alt="Чаты"></span>
            <span class="nav-icon" data-tab="settings"><img src="{% static 'icons/НАСТРОЙКИ.svg' %}" alt="Настройки"></span>
        </div>
    </nav>

    <a href="{% if request.user.is_authenticated %}{% url 'profile' request.user.username %}{% else %}{% url 'login' %}{% endif %}" id="avatarLink">
        <div class="avatar-circle avatar-back" id="avatarBack"></div>
        <div class="avatar-circle avatar-front" id="avatarFront">
            <img src="{% static 'icons/АВАТАР.svg' %}" alt="avatar">
        </div>
    </a>

    <div class="main-content" style="padding-top: 100px;">
        <div class="container-fluid mt-4">
            {% block content %}{% endblock %}
        </div>
    </div>

    <div class="disc-wrapper">
        <div class="disc-container">
            <!-- Задняя часть диска (таскается) -->
            <img src="{% static 'player/ЗАДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-back" style="border-radius: 50%;" alt="">
            
            <!-- Обложка (крутится) -->
            <div class="disc-cover-spin playing">
                <img src="{% static 'player/диск.png' %}" alt="cover">
            </div>
            
            <!-- Передняя часть диска -->
            <img src="{% static 'player/ПЕРЕДНЯЯ_ЧАСТЬ_ДИСКА.svg' %}" class="disc-layer disc-front" alt="">
            
            <!-- Прямоугольник слева -->
            <img src="{% static 'player/задняя_часть_диска_2.svg' %}" class="disc-rect" alt="">
            
            <!-- Кнопки на прямоугольнике -->
            <img src="{% static 'player/NEXT_SONG_WHITE_VER.svg' %}" class="disc-btn disc-btn-next" alt="Next">
            <img src="{% static 'player/PREV_SONG_WHITE_VER.svg' %}" class="disc-btn disc-btn-prev" alt="Prev">
            <img src="{% static 'player/ПУСТОЕ_СЕРДЦЕ.svg' %}" class="disc-btn disc-btn-like" alt="Like">
            <a href="#" id="discInfoLink">
                <img src="{% static 'player/ИНФО_ДЛЯ_ТРЕКА.svg' %}" class="disc-btn disc-btn-info" alt="Info">
            </a>
            <img src="{% static 'player/РАЗБИТОЕ_СЕРДЦЕ.svg' %}" class="disc-btn disc-btn-dislike" alt="Dislike">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const indicator = document.querySelector('.glow-indicator');
        const icons = document.querySelectorAll('.nav-icon');
        const activeIcon = document.querySelector('.nav-icon.active');
        if (activeIcon) {
            indicator.style.left = (activeIcon.offsetLeft + activeIcon.offsetWidth/2 - 27) + 'px';
        }
        icons.forEach(icon => {
            icon.addEventListener('click', function() {
                icons.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                indicator.style.left = (this.offsetLeft + this.offsetWidth/2 - 27) + 'px';
            });
        });

        // Drag диска
        const disc = document.querySelector('.disc-back');
        const wrapper = document.querySelector('.disc-wrapper');
        let isDragging = false, startX, startY, startLeft, startBottom;
        disc.addEventListener('mousedown', function(e) {
            isDragging = true;
            startX = e.clientX; startY = e.clientY;
            startLeft = parseInt(window.getComputedStyle(wrapper).left) || 0;
            startBottom = parseInt(window.getComputedStyle(wrapper).bottom) || 0;
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            wrapper.style.left = (startLeft + e.clientX - startX) + 'px';
            wrapper.style.bottom = (startBottom + startY - e.clientY) + 'px';
        });
        document.addEventListener('mouseup', function() { isDragging = false; });
    </script>

    <audio id="audioPlayer" style="display: none;"></audio>
    
</body>
</html>
